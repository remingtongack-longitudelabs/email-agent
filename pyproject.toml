[project]
name = "gmail-drafts"
version = "0.2.0"
description = "Safely create Gmail drafts with attachments, then send them in a confirmed step"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
gmail-drafts = "gmail_drafts:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gmail_drafts", "mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B904"]

[tool.mypy]
ignore_missing_imports = true
